<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Bartender</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body class="flyout">
  <!-- Every setting at once, beside the flyout so changes show as they're made. -->
  <aside class="settings-panel" id="panel" hidden></aside>
  <main class="flyout-column" id="column">
    <header class="flyout-controls" id="controls"></header>
    <div class="flyout-middle" id="middle"></div>
    <!-- Volume sits at the bottom, next to the tray icon the user just clicked. -->
    <section class="flyout-volume">
      <div id="dock"></div>
      <div id="device"></div>
      <div id="master"></div>
    </section>
  </main>
  <div id="popup-layer"></div>
</body>
</html>
