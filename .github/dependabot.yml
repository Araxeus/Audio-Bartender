version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # These must match the versions `windows` depends on, or their types differ from the
    # ones its APIs take. Bump them by hand together with `windows`.
    ignore:
      - dependency-name: windows-core
      - dependency-name: windows-numerics
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
