name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      # .cargo/config.toml points GPUI at this repo's dev machine SDK; use the runner's newest.
      - name: Find the shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      # build.ps1 fails when the tag doesn't match the workspace version in Cargo.toml.
      - name: Build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { '' }
          ./build.ps1 -Version $version

      # Release assets get names people recognize. The installer installs either
      # interface as AudioBartender.exe; the portable exes are one per interface.
      - name: Name the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/audio_bartender_setup.exe release/AudioBartender-setup.exe
          Copy-Item dist/audio_bartender_gpui.exe release/AudioBartender-portable.exe
          Copy-Item dist/audio_bartender_tauri.exe release/AudioBartender-web-portable.exe

      # Manual runs produce a test build only.
      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio_bartender
          path: release/*.exe

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.exe

      # Immutable releases reject files added after publishing, so publish only once all are attached.
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG --draft --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY `
            release/AudioBartender-setup.exe release/AudioBartender-portable.exe release/AudioBartender-web-portable.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:TAG --draft=false --repo $env:GITHUB_REPOSITORY
