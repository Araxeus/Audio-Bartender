name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'apps/tauri/ui/**', 'scripts/build-demo.ps1', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The live demo runs the real Tauri front end, copied in at deploy time.
      - name: Copy the flyout into the demo
        shell: pwsh
        run: ./scripts/build-demo.ps1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
