[workspace]
resolver = "3"
members = ["crates/core", "apps/gpui", "apps/tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
audio_bartender_core = { path = "crates/core" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
